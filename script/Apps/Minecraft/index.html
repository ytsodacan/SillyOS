<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minecraft</title>
    <style>
        html, body {
            margin: 0; padding: 0; height: 100%; width: 100%;
            overflow: hidden; background: #000; font-family: sans-serif;
        }
        iframe {
            width: 100%; height: 100%; border: none;
        }
        #ld {
            position: fixed; inset: 0; display: flex; flex-direction: column;
            align-items: center; justify-content: center; background: #0a0a0a; z-index: 10;
        }
        #ld img {
            width: 260px; margin-bottom: 24px;
            image-rendering: pixelated;
        }
        .mc-bar {
            width: 260px; height: 8px; background: #1a1a1a;
            border: 1px solid #333; border-radius: 2px; overflow: hidden;
        }
        .mc-fill {
            height: 100%; width: 0%; background: #5b9d35;
            animation: load 1.8s ease-out forwards;
        }
        @keyframes load { to { width: 100%; } }
        .mc-text { color: #555; font-size: 11px; margin-top: 10px; letter-spacing: 1px; }

        #fs-btn {
            position: fixed; bottom: 12px; right: 12px; z-index: 999;
            background: rgba(0,0,0,0.6); border: 1px solid rgba(255,255,255,0.15);
            color: #fff; padding: 7px 12px; border-radius: 8px; cursor: pointer;
            font-size: 13px; display: flex; align-items: center; gap: 6px;
            backdrop-filter: blur(6px); transition: background 0.2s, opacity 0.2s;
            opacity: 0.5;
        }
        #fs-btn:hover { background: rgba(30,30,30,0.85); opacity: 1; }
        #fs-btn svg { width: 15px; height: 15px; fill: #fff; }
    </style>
</head>
<body>

    <div id="ld">
        <img src="https://upload.wikimedia.org/wikipedia/commons/e/ea/Minecraft_Steve_head.png" alt="Minecraft">
        <div class="mc-bar"><div class="mc-fill"></div></div>
        <div class="mc-text">LOADING MINECRAFT...</div>
    </div>

    <iframe id="ifr"
        allowfullscreen
        allow="autoplay; fullscreen; gamepad; microphone; camera; pointer-lock"
        src="about:blank">
    </iframe>

    <button id="fs-btn" title="Fullscreen" onclick="toggleFullscreen()">
        <svg id="fs-icon-expand" viewBox="0 0 24 24"><path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/></svg>
        <svg id="fs-icon-compress" viewBox="0 0 24 24" style="display:none"><path d="M5 16h3v3h2v-5H5v2zm3-8H5v2h5V5H8v3zm6 11h2v-3h3v-2h-5v5zm2-11V5h-2v5h5V8h-3z"/></svg>
        Fullscreen
    </button>

    <script>
        // Show iframe after loading animation
        setTimeout(function() {
            document.getElementById('ld').style.display = 'none';
            document.getElementById('ifr').src = 'https://ytsodacan.github.io/minecraft';
        }, 1900);

        function toggleFullscreen() {
            var el = document.getElementById('ifr');
            var expand = document.getElementById('fs-icon-expand');
            var compress = document.getElementById('fs-icon-compress');
            if (!document.fullscreenElement) {
                (el.requestFullscreen || el.webkitRequestFullscreen || el.mozRequestFullScreen).call(el);
                expand.style.display = 'none';
                compress.style.display = 'block';
            } else {
                (document.exitFullscreen || document.webkitExitFullscreen || document.mozCancelFullScreen).call(document);
                expand.style.display = 'block';
                compress.style.display = 'none';
            }
        }

        document.addEventListener('fullscreenchange', function() {
            if (!document.fullscreenElement) {
                document.getElementById('fs-icon-expand').style.display = 'block';
                document.getElementById('fs-icon-compress').style.display = 'none';
            }
        });
    </script>
</body>
</html>
