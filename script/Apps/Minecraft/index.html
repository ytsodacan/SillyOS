<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minecraft</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; }
        html, body { margin:0; padding:0; width:100%; height:100%; overflow:hidden; background:#111; font-family:sans-serif; }

        #nav-bar {
            position:fixed; top:0; left:0; right:0; height:40px;
            background:rgba(0,0,0,0.6); backdrop-filter:blur(10px);
            border-bottom:1px solid rgba(255,255,255,0.08);
            display:flex; align-items:center; gap:8px; padding:0 10px; z-index:100;
        }
        #nav-bar button {
            background:rgba(255,255,255,0.1); border:1px solid rgba(255,255,255,0.15);
            color:white; padding:4px 12px; border-radius:6px; cursor:pointer;
            font-size:12px; font-weight:600; transition:background 0.2s;
            display:flex; align-items:center; gap:5px;
        }
        #nav-bar button:hover { background:rgba(255,255,255,0.22); }
        #nav-title { flex:1; color:rgba(255,255,255,0.5); font-size:12px; letter-spacing:2px; text-align:center; font-weight:600; }

        #loader {
            position:fixed; inset:40px 0 0 0;
            display:flex; flex-direction:column; align-items:center; justify-content:center;
            background:#111; z-index:50; gap:16px; transition:opacity 0.4s;
        }
        #loader img { width:72px; height:72px; image-rendering:pixelated; }
        .mc-title { color:#fff; font-size:18px; font-weight:bold; letter-spacing:3px; text-shadow:2px 2px #000; }
        .mc-bar-wrap { width:220px; height:8px; background:#222; border:1px solid #444; border-radius:2px; overflow:hidden; }
        .mc-bar-fill { height:100%; width:0; background:linear-gradient(90deg,#4a8c1c,#6ab02a); animation:mcload 1.6s ease-out forwards; }
        @keyframes mcload { to { width:100%; } }
        .mc-sub { color:#555; font-size:11px; letter-spacing:1px; }

        #game-frame { position:fixed; inset:40px 0 0 0; border:none; width:100%; height:calc(100% - 40px); background:#000; display:block; }
    </style>
</head>
<body>

<div id="nav-bar">
    <button onclick="goBack()">&#8592; Back</button>
    <div id="nav-title">MINECRAFT</div>
    <button id="fs-nav-btn" onclick="toggleFS()" style="display:none">&#x2197; Open in New Tab</button>
</div>

<div id="loader">
    <img src="icon.png" alt="Minecraft" onerror="this.style.display='none'">
    <div class="mc-title">MINECRAFT</div>
    <div class="mc-bar-wrap"><div class="mc-bar-fill"></div></div>
    <div class="mc-sub">LOADING...</div>
</div>

<iframe id="game-frame" src="about:blank"
    allowfullscreen
    allow="autoplay; fullscreen; gamepad; pointer-lock; clipboard-read; clipboard-write; microphone; camera"
    referrerpolicy="no-referrer">
</iframe>

<script>
    setTimeout(function() {
        var loader = document.getElementById('loader');
        loader.style.opacity = '0';
        setTimeout(function() {
            loader.style.display = 'none';
            document.getElementById('game-frame').src = 'https://ytsodacan.github.io/minecraft';
            document.getElementById('fs-nav-btn').style.display = 'flex';
        }, 420);
    }, 1700);

    function goBack() {
        try {
            if (window.parent && window.parent.closeWindow) window.parent.closeWindow('minecraft');
            else if (window.parent !== window) window.parent.postMessage({action:'closeApp',id:'minecraft'}, '*');
        } catch(e) {}
        document.getElementById('game-frame').src = 'about:blank';
    }

    // Open the game in a new tab for true fullscreen
    function toggleFS() {
        window.open('https://ytsodacan.github.io/minecraft', '_blank');
    }

    function onFSChange() {
        var inFS = !!(document.fullscreenElement || document.webkitFullscreenElement);
        var btn = document.getElementById('fs-nav-btn');
        if(btn) btn.textContent = inFS ? '⛶ Exit Fullscreen' : '⛶ Fullscreen';
    }
    document.addEventListener('fullscreenchange',       onFSChange);
    document.addEventListener('webkitfullscreenchange', onFSChange);
</script>
</body>
</html>
