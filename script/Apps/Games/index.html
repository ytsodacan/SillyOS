<!DOCTYPE html>
<html>
<head>
    <title>Games</title>
    <meta charset="UTF-8">
    <style>
        *, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }
        html, body { width:100%; height:100%; overflow:hidden; background:linear-gradient(135deg,#2e3244 0%,#36224b 100%); font-family:Arial,sans-serif; }

        #nav-bar {
            position:fixed; top:0; left:0; right:0; height:42px;
            background:rgba(0,0,0,0.45); backdrop-filter:blur(12px);
            border-bottom:1px solid rgba(255,255,255,0.1);
            display:flex; align-items:center; gap:8px; padding:0 12px; z-index:9999;
        }
        #nav-bar button {
            background:rgba(255,255,255,0.12); border:1px solid rgba(255,255,255,0.18);
            color:white; padding:5px 14px; border-radius:6px; cursor:pointer;
            font-size:13px; font-weight:600; display:flex; align-items:center; gap:6px; transition:background 0.2s;
        }
        #nav-bar button:hover { background:rgba(255,255,255,0.22); }
        #nav-bar button:disabled { opacity:0.35; cursor:default; }
        #nav-url { flex:1; color:rgba(255,255,255,0.6); font-size:12px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

        #game-viewer { position:fixed; inset:42px 0 0 0; display:none; z-index:9998; background:#000; }
        #game-viewer.open { display:block; }
        #game-iframe { width:100%; height:100%; border:none; background:#000; display:block; }

        #game-list-wrap { position:fixed; inset:42px 0 0 80px; overflow-y:auto; }

        .sidebar {
            position:fixed; left:0; top:42px; bottom:0; width:80px;
            background:rgba(0,0,0,0.3); backdrop-filter:blur(10px);
            padding:10px 5px; display:flex; flex-direction:column; gap:8px; overflow-y:auto; z-index:100;
        }
        .sidebar-btn {
            background:rgb(89,134,218); border:none; padding:10px 4px; font-size:15px; font-weight:700;
            border-radius:8px; cursor:pointer; color:white; text-align:center; min-height:40px; transition:all 0.2s;
        }
        .sidebar-btn:hover { background:#79aadb; transform:scale(1.05); }

        .main-content { padding:20px; }
        h1 { color:white; text-align:center; margin-bottom:20px; text-shadow:2px 2px 4px rgba(0,0,0,0.3); }
        h2 { color:white; text-align:center; margin-bottom:20px; font-weight:normal; font-size:18px; text-shadow:2px 2px 4px rgba(0,0,0,0.3); }
        .letter-section { margin-bottom:40px; padding:0 20px; max-width:900px; margin-left:auto; margin-right:auto; }
        .letter-header { color:white; font-size:32px; font-weight:bold; margin-bottom:15px; padding-bottom:10px; border-bottom:3px solid rgba(255,255,255,0.3); text-shadow:2px 2px 4px rgba(0,0,0,0.3); }
        .buttons-container { display:flex; flex-direction:column; gap:10px; align-items:center; }
        input[type="button"] {
            background:rgb(89,134,218); border:none; padding:15px 30px; font-size:16px; font-weight:500;
            border-radius:8px; cursor:pointer; box-shadow:0 4px 6px rgba(0,0,0,0.1); transition:all 0.3s ease;
            width:100%; max-width:600px; color:white; text-align:left;
        }
        input[type="button"]:hover { transform:translateY(-2px); box-shadow:0 6px 12px rgba(0,0,0,0.2); background:#79aadb; }
        a { color:#79aadb; text-decoration:none; }
        #searchInput { padding:13px; width:100%; max-width:420px; border-radius:8px; border:none; }
        #lolbutton { background:rgba(89,134,218,0.5); color:white; border:none; padding:8px 16px; border-radius:6px; cursor:pointer; margin-top:8px; }
    </style>
</head>
<body>

<div id="nav-bar">
    <button id="btn-back" onclick="goBack()" disabled>&#8592; Back</button>
    <div id="nav-url">Games Library</div>
    <button id="btn-fs" onclick="toggleFullscreen()" style="display:none">&#x26F6; Fullscreen</button>
</div>

<div id="game-viewer">
    <iframe id="game-iframe" src="about:blank"
        allowfullscreen
        allow="autoplay; fullscreen; gamepad; pointer-lock; clipboard-read; clipboard-write"
        referrerpolicy="no-referrer">
    </iframe>
</div>

<div class="sidebar" id="sidebar"></div>

<div id="game-list-wrap">
    <div class="main-content">
        <h1>UGS Files</h1>
        <h2>Files from <a href="#" onclick="loadGame('https://docs.google.com/document/d/1_FmH3BlSBQI7FGgAQL59-ZPe8eCxs35wel6JUyVaG8Q/');return false;">Ultimate Game Stash Google Doc</a></h2>
        <h2>Discord: <a href="#" onclick="loadGame('https://discord.gg/rmVsAqkpkA');return false;">discord.gg/rmVsAqkpkA</a></h2>
        <h2>
            <input type="text" placeholder="Search..." id="searchInput">
            <script src="https://cdn.jsdelivr.net/gh/mcgee1717/994894838923761723@main/searchbut.js"></script>
            <button id="lolbutton" onclick="loadExternalScript()">Click to reload if not loading</button>
        </h2>
        <div id="sections-container"></div>
    </div>
</div>

<script>
    // Override window.open before anything else loads
    window.open = function(url) { if (url) loadGame(url); return null; };

    function loadGame(url) {
        if (!url || url === '#' || url === 'about:blank') return;
        document.getElementById('game-iframe').src = url;
        document.getElementById('game-viewer').classList.add('open');
        document.getElementById('nav-url').textContent = url;
        document.getElementById('btn-back').disabled = false;
        document.getElementById('btn-fs').style.display = 'flex';
    }

    function goBack() {
        document.getElementById('game-viewer').classList.remove('open');
        document.getElementById('game-iframe').src = 'about:blank';
        document.getElementById('nav-url').textContent = 'Games Library';
        document.getElementById('btn-back').disabled = true;
        document.getElementById('btn-fs').style.display = 'none';
        if (document.fullscreenElement) document.exitFullscreen();
    }

    function toggleFullscreen() {
        var el = document.getElementById('game-viewer');
        if (!document.fullscreenElement) el.requestFullscreen && el.requestFullscreen();
        else document.exitFullscreen && document.exitFullscreen();
    }

    function loadExternalScript() {
        var s = document.createElement('script');
        s.src = 'https://cdn.jsdelivr.net/gh/mcgee1717/994894838923761723@latest/games.js';
        document.body.appendChild(s);
    }

    // Intercept ALL clicks in capture phase
    document.addEventListener('click', function(e) {
        var a = e.target.closest('a[href]');
        if (a && a.href && !a.href.startsWith('javascript') && a.href !== location.href + '#') {
            e.preventDefault(); e.stopPropagation();
            loadGame(a.href); return;
        }
        var btn = e.target.closest('input[type="button"]');
        if (btn && btn.onclick) {
            e.preventDefault(); e.stopPropagation();
            // Extract URL from onclick string
            var str = btn.getAttribute('onclick') || '';
            var m = str.match(/https?:\/\/[^\s'"`)]+/);
            if (m) { loadGame(m[0]); return; }
            // Let onclick fire — window.open is already overridden
            var orig = btn.onclick;
            btn.onclick = null;
            try { orig.call(btn, e); } catch(ex) {}
            btn.onclick = orig;
        }
    }, true);

    // Build sidebar
    function buildSidebar() {
        var sb = document.getElementById('sidebar');
        sb.innerHTML = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('').map(function(l) {
            return '<button class="sidebar-btn" onclick="scrollToLetter(\'' + l + '\')">' + l + '</button>';
        }).join('');
    }

    function scrollToLetter(l) {
        document.querySelectorAll('.letter-section').forEach(function(s) {
            var h = s.querySelector('.letter-header');
            if (h && h.textContent.trim().toUpperCase().startsWith(l)) s.scrollIntoView({behavior:'smooth'});
        });
    }

    buildSidebar();

    // Patch dynamically-added buttons every 600ms
    setInterval(function() {
        document.querySelectorAll('input[type="button"]:not([data-patched])').forEach(function(btn) {
            btn.setAttribute('data-patched', '1');
            var orig = btn.onclick;
            if (!orig) return;
            btn.onclick = null;
            btn.addEventListener('click', function(e) {
                e.preventDefault(); e.stopPropagation();
                var str = orig.toString();
                var m = str.match(/https?:\/\/[^\s'"`)]+/);
                if (m) { loadGame(m[0]); return; }
                try { orig.call(btn, e); } catch(ex) {}
            }, true);
        });
    }, 600);

    // Load games.js
    var s = document.createElement('script');
    s.src = 'https://cdn.jsdelivr.net/gh/mcgee1717/994894838923761723@49119bc/games.js';
    document.body.appendChild(s);
</script>
</body>
</html>
