<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Browser</title>
    <style>
        *{box-sizing:border-box;margin:0;padding:0}
        html,body{width:100%;height:100%;overflow:hidden;background:#0d0d0d;font-family:-apple-system,sans-serif}
        #nav{position:fixed;top:0;left:0;right:0;height:44px;z-index:9999;background:rgba(18,18,18,0.95);backdrop-filter:blur(14px);border-bottom:1px solid rgba(255,255,255,0.07);display:flex;align-items:center;gap:6px;padding:0 10px}
        .nbtn{background:rgba(255,255,255,0.07);border:1px solid rgba(255,255,255,0.1);color:rgba(255,255,255,0.7);width:32px;height:28px;border-radius:6px;cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center;transition:background .15s;flex-shrink:0}
        .nbtn:hover{background:rgba(255,255,255,0.15);color:#fff}
        .nbtn:disabled{opacity:0.3;cursor:default}
        #ubar{flex:1;display:flex;align-items:center;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.1);border-radius:8px;height:30px;padding:0 10px;gap:6px;transition:border-color .2s}
        #ubar:focus-within{border-color:rgba(255,255,255,0.3);background:rgba(255,255,255,0.1)}
        #url{flex:1;background:none;border:none;outline:none;color:rgba(255,255,255,0.85);font-size:13px;min-width:0}
        #url::placeholder{color:rgba(255,255,255,0.3)}
        #gobtn{background:#5865f2;border:none;color:#fff;padding:0 12px;height:28px;border-radius:6px;cursor:pointer;font-size:12px;font-weight:600;flex-shrink:0;transition:background .15s}
        #gobtn:hover{background:#4752c4}
        #lbar{position:fixed;top:44px;left:0;height:2px;width:0;background:linear-gradient(90deg,#5865f2,#9f6ef5);z-index:9998;transition:width .3s}
        #frame{position:fixed;inset:44px 0 0 0;width:100%;height:calc(100% - 44px);border:none;background:#0d0d0d}
        #home{position:fixed;inset:44px 0 0 0;background:#0d0d0d;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px}
        #home h1{color:rgba(255,255,255,0.08);font-size:56px;font-weight:800;letter-spacing:4px}
        #home p{color:rgba(255,255,255,0.2);font-size:12px}
        .qs{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap;justify-content:center}
        .qb{background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.08);color:rgba(255,255,255,0.45);padding:8px 16px;border-radius:8px;cursor:pointer;font-size:12px;transition:all .15s}
        .qb:hover{background:rgba(255,255,255,0.1);color:#fff}
    </style>
</head>
<body>
<div id="nav">
    <button class="nbtn" id="bb" onclick="hNav(-1)" disabled>&#8592;</button>
    <button class="nbtn" id="fb" onclick="hNav(1)"  disabled>&#8594;</button>
    <button class="nbtn" onclick="rl()">&#8635;</button>
    <div id="ubar">
        <span style="color:rgba(255,255,255,0.3);font-size:11px;flex-shrink:0">🔒</span>
        <input id="url" type="text" placeholder="Search or enter a URL..." spellcheck="false" autocomplete="off"
            onkeydown="if(event.key==='Enter')go(this.value)">
    </div>
    <button id="gobtn" onclick="go(document.getElementById('url').value)">Go</button>
</div>
<div id="lbar"></div>
<div id="home">
    <h1>BROWSER</h1>
    <p>Powered by relay.neurosama.place (Scramjet)</p>
    <div class="qs">
        <button class="qb" onclick="go('google.com')">Google</button>
        <button class="qb" onclick="go('youtube.com')">YouTube</button>
        <button class="qb" onclick="go('open.spotify.com')">Spotify</button>
        <button class="qb" onclick="go('discord.com/app')">Discord</button>
        <button class="qb" onclick="go('reddit.com')">Reddit</button>
        <button class="qb" onclick="go('github.com')">GitHub</button>
        <button class="qb" onclick="loadProxy()">🏠 Proxy Home</button>
    </div>
</div>
<iframe id="frame" src="about:blank" allowfullscreen
    allow="autoplay; fullscreen; gamepad; pointer-lock; clipboard-read; clipboard-write; microphone; camera"
    referrerpolicy="no-referrer"></iframe>
<script>
    var PROXY = 'https://relay.neurosama.place/';
    var fr = document.getElementById('frame');
    var urlInp = document.getElementById('url');
    var home = document.getElementById('home');
    var lb = document.getElementById('lbar');
    var hist = [], hi = -1;

    function norm(raw) {
        raw = raw.trim();
        if (!raw) return '';
        if (/^https?:\/\//i.test(raw)) return raw;
        if (raw.includes('.') && !raw.includes(' ')) return 'https://' + raw;
        return 'https://www.google.com/search?q=' + encodeURIComponent(raw);
    }

    // Build the scramjet proxy URL.
    // relay.neurosama.place uses Scramjet — the standard encoding is
    // base64url of the target URL appended after the proxy root.
    function proxyUrl(url) {
        try {
            // Standard scramjet path format
            var b64 = btoa(url).replace(/\+/g,'-').replace(/\//g,'_').replace(/=/g,'');
            return PROXY + '~/uJDQ=/' + b64;
        } catch(e) {
            return PROXY;
        }
    }

    function loadProxy() {
        home.style.display = 'none';
        urlInp.value = PROXY;
        startLoad();
        fr.src = PROXY;
        fr.onload = function(){ stopLoad(); };
    }

    function go(input) {
        var url = norm(input);
        if (!url) { loadProxy(); return; }
        home.style.display = 'none';
        urlInp.value = url;
        hist = hist.slice(0, hi + 1);
        hist.push(url); hi++;
        updBtns();
        startLoad();
        // Navigate via proxy
        fr.src = proxyUrl(url);
        fr.onload = function() { stopLoad(); };
    }

    function hNav(d) {
        hi = Math.max(0, Math.min(hist.length - 1, hi + d));
        updBtns();
        startLoad();
        fr.src = proxyUrl(hist[hi]);
        urlInp.value = hist[hi];
        fr.onload = function(){ stopLoad(); };
    }

    function rl() {
        if (fr.src && fr.src !== 'about:blank') { startLoad(); fr.src = fr.src; fr.onload = function(){ stopLoad(); }; }
    }

    function updBtns() {
        document.getElementById('bb').disabled = hi <= 0;
        document.getElementById('fb').disabled = hi >= hist.length - 1;
    }

    function startLoad(){ lb.style.width='40%'; lb.style.transition='width 1.2s ease'; }
    function stopLoad(){ lb.style.width='100%'; lb.style.transition='width .2s'; setTimeout(function(){ lb.style.width='0'; lb.style.transition='none'; },300); }

    document.addEventListener('keydown', function(e) {
        if((e.ctrlKey||e.metaKey)&&e.key==='l'){ e.preventDefault(); urlInp.focus(); urlInp.select(); }
    });
</script>
</body>
</html>
